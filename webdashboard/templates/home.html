<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Home</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        .tabs {
            display: flex;
            gap: 20px;
            border-bottom: 1px solid #21262d;
            margin-bottom: 20px;
            padding-bottom: 10px;
        }

        .tabs a {
            text-decoration: none;
            color: #58a6ff;
            font-size: 16px;
            padding: 5px 10px;
        }

        .tabs a.active {
            border-bottom: 2px solid #58a6ff;
            font-weight: bold;
        }

        .header {
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 28px;
            margin: 0 0 10px;
        }

        .header p {
            font-size: 16px;
            color: #8b949e;
            margin: 0;
        }

        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .actions .search {
            flex: 1;
            margin-right: 10px;
        }

        .actions input {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #30363d;
            border-radius: 6px;
            background-color: #161b22;
            color: #c9d1d9;
        }

        .actions button {
            padding: 10px 20px;
            background-color: #238636;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin-left: 20px;
        }

        .actions button:hover {
            background-color: #2ea043;
        }

        .report-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .report-item {
            padding: 15px;
            border: 1px solid #21262d;
            border-radius: 6px;
            background-color: #161b22;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .report-item span {
            font-size: 16px;
            color: #58a6ff;
            cursor: pointer;
        }

        .report-item span:hover {
            text-decoration: underline;
        }

        .report-item .meta {
            font-size: 14px;
            color: #8b949e;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Tabs at the top -->
        <div class="tabs">
            <a href="#" class="active">Reports</a>
            <a href="#">Settings</a>
            <a href="#">Help</a>
        </div>

        <!-- Header Section -->
        <div class="header">
            <h1>Your Reports</h1>
            <p>Manage your reports. Search or create new reports below.</p>
        </div>

        <!-- Actions: Search and Create -->
        <div class="actions">
            <div class="search">
                <input type="text" placeholder="Find a report..." />
            </div>
            <button onclick="window.location.href='/{{ username }}/reports/new'">New Report</button>
        </div>

        <!-- Reports List -->
        <ul class="report-list">
            {% for report in reports %}
            <li class="report-item">
                <div>
                    <span onclick="alert('View {{ report.name }}')">{{ report.name }}</span>
                    <div class="meta">{{ report.updated }}</div>
                </div>
            </li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
