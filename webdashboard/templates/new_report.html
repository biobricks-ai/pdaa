<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Report</title>
    <script src="https://unpkg.com/htmx.org"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        .header {
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            color: #8b949e;
        }

        .full-width {
            width: 100%;
            max-width: 100%;
            margin-bottom: 15px;
            padding: 15px;
            font-size: 14px;
            border: 1px solid #30363d;
            border-radius: 6px;
            background-color: #161b22;
            color: #c9d1d9;
            position: relative;
        }

        .add-section {
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px dashed #30363d;
            cursor: pointer;
            color: #58a6ff;
        }

        .add-section:hover {
            background-color: #21262d;
        }

        .add-section svg {
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="sections">
        </div>
        <div 
            class="full-width add-section" 
            hx-get="/section/section-form"
            hx-swap="beforeend" 
            hx-target="#sections">
            <svg xmlns="http://www.w3.org/2000/svg" height="24" width="24" fill="#58a6ff" viewBox="0 0 24 24">
                <path d="M12 22q-4.15 0-7.075-2.925Q2 16.15 2 12q0-4.15 2.925-7.075Q7.85 2 12 2q4.15 0 7.075 2.925Q22 7.85 22 12q0 4.15-2.925 7.075Q16.15 22 12 22ZM11 17h2v-4h4v-2h-4V7h-2v4H7v2h4Z"/>
            </svg>
            Add a Section
        </div>
    </div>
</body>
</html>
